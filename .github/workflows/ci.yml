name: CI
on:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site (fails on dangling image references)
        run: python3 build.py --check
      - name: Sanity checks
        run: |
          test -s site/index.html
          test "$(ls issues | wc -l)" -eq "$(ls site/issues | wc -l)"
          if grep -rEl 'list-manage\.com/(unsubscribe|profile|track)|\*\|[A-Z_]+\|\*|\[UNIQID\]' issues; then
            echo "personal or tracking links found in issues/"; exit 1
          fi
